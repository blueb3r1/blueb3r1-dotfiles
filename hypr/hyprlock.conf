# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = screenshot
    color = rgb(2b3339)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    
    outer_color = rgb(a6b46b)
    inner_color = rgb(2b3339)
    font_color = rgb(d3c6aa)
    check_color = rgb(dbbc7f)
    fail_color = rgb(e67e80)
    
    fade_on_empty = false
    placeholder_text = <i>Enter your password</i>
    hide_input = false
    
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(d3c6aa)
    font_size = 65
    font_family = monospace bold
    
    position = 0, 80
    halign = center
    valign = center
}